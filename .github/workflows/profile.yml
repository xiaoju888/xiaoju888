name: Update Profile Images

on:
  schedule:
    - cron: "23 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-images
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare dark block settings
        run: |
          mkdir -p conf
          curl --fail --location https://raw.githubusercontent.com/yoshi389111/github-profile-3d-contrib/main/sample-settings/gitblock.json -o conf/gitblock-dark.json
          python - <<'PY'
          import json

          path = "conf/gitblock-dark.json"

          with open(path, "r", encoding="utf-8") as file:
              settings = json.load(file)

          settings.update({
              "fileName": "profile-gitblock-dark.svg",
              "backgroundColor": "#0d1117",
              "foregroundColor": "#c9d1d9",
              "strongColor": "#ffffff",
              "weakColor": "#484f58",
              "radarColor": "#47a042"
          })

          settings["contribPatterns"][0]["top"]["backgroundColor"] = "#161b22"
          settings["contribPatterns"][0]["top"]["foregroundColor"] = "#30363d"

          with open(path, "w", encoding="utf-8") as file:
              json.dump(settings, file, indent=2)
          PY
      - name: Generate 3D contribution images
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: conf/gitblock-dark.json
      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist profile-3d-contrib

          if git diff --cached --quiet; then
            echo "No image changes"
          else
            git commit -m "Update profile images"
            git push
          fi
